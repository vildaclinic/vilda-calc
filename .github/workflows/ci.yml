name: Kontrola jakości

on:
  push:
    branches: [audyt]
  pull_request:
    branches: [audyt]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vilda-calc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint, składnia i testy jednostkowe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          # Krok wersji niżej. PR: commit scalenia z rodzicami, HEAD^1 to audyt, do którego PR wejdzie.
          # workflow_dispatch na gałęzi (np. „Wygląd” po odświeżeniu wzorców): pełna historia z origin/audyt.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/audyt' && '0' || '2' }}
      - name: Skonfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Zainstaluj zależności
        run: npm ci
      - name: Uruchom kontrole bez przeglądarki
        run: npm test
      # P-WERSJE-CI: drzewo PR-a po scaleniu z audyt musi mieć wersje policzone względem tego audyt.
      # „Update branch” albo scalenie audyt bez ponownego `npm run podbij-wersje` przechodziło
      # npm test, bo scalone drzewo jest wewnętrznie spójne — a dwa wątki z tym samym SW_VERSION
      # scalały się bez konfliktu (siedem razy od 2026-09-28, m.in. #591, #594, #595). Na PR-ze
      # checkout daje commit scalenia, więc HEAD^1 jest dokładnie bazą; reguła „up to date”
      # sprawia, że ten krok widzi audyt sprzed scalenia PR-a. „Wygląd” wypycha wzorce commitem
      # bota i uruchamia ten workflow przez workflow_dispatch na gałęzi PR-a — ten przebieg też
      # daje wymagany status, więc krok idzie i tam, z bazą origin/audyt (gałąź musi go zawierać).
      # Na push do audyt krok pomijamy.
      - name: Sprawdź wersje względem audyt
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/audyt')
        env:
          BAZA: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'origin/audyt' }}
        run: |
          kod=0
          wynik=$(node tests/scripts/podbij-wersje.mjs --sprawdz --bez-sieci --baza="$BAZA" 2>&1) || kod=$?
          printf '%s\n' "$wynik"
          # Linie „BŁĄD:” (np. usunięty historyczny wpis precache) skrypt odmawia naprawić sam.
          printf '%s\n' "$wynik" | grep '^BŁĄD: ' | while IFS= read -r linia; do
            linia=${linia#BŁĄD: }
            echo "::error title=Błąd wersji do ręcznej poprawki::${linia//%/%25}"
          done || true
          # „Do decyzji” (np. zmieniona treść pliku z nieliczbowym ?v=) nie zmienia kodu, ale ma być widoczne
          # w podsumowaniu PR-a, nie tylko w logu zielonego joba. Piny w testach pomijamy — to lista do przejrzenia.
          printf '%s\n' "$wynik" | grep '^Do decyzji: ' | grep -v '^Do decyzji: pin wersji w teście' | while IFS= read -r linia; do
            linia=${linia#Do decyzji: }
            echo "::warning title=Wersje — do decyzji::${linia//%/%25}"
          done || true
          if [ "$kod" = 1 ]; then
            echo "::error title=Wersje niespójne z audyt::Na gałęzi PR-a: git pull --no-rebase (po „Update branch” gałąź na GitHubie ma nowy commit) && git fetch origin audyt && git merge origin/audyt && npm run podbij-wersje && npm test, potem git add -A, commit i push. Linie „BŁĄD:” z logu popraw najpierw ręcznie — bez tego skrypt nic nie zapisze. Procedura: docs/GITHUB_WORKFLOW.md, „Kilka wątków naraz”."
          elif [ "$kod" != 0 ]; then
            echo "::error title=Nie policzono wersji::podbij-wersje zakończył się kodem $kod — przyczyna w logu wyżej."
          fi
          exit "$kod"

  browser:
    # Nazwa jest widoczna dla właściciela jako odłamek, a wymagany status w regułach gałęzi
    # to job „Testy przeglądarkowe i PWA" niżej, który zbiera wyniki wszystkich odłamków.
    name: E2E odłamek ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    # Po „Squash and merge" e2e nie idą drugi raz. Reguła gałęzi „Require branches to be
    # up to date before merging" gwarantuje, że drzewo po squashu jest tym samym drzewem,
    # które przeszło testy na PR-ze — drugi, 15-minutowy przebieg niczego nie dokładał.
    # Lint i testy jednostkowe (job wyżej) na push zostają: kosztują minutę i dają gałęzi
    # własną historię zielone/czerwone. Pełny zestaw na audyt: ręcznie (workflow_dispatch).
    if: github.event_name != 'push'
    # Trzy runnery naraz, każdy z czterema workerami — dla repozytorium publicznego minuty
    # Actions nic nie kosztują, a zestaw dzieli się plikami między maszyny. Nie czeka na
    # job jednostkowy: ten i tak kończy się po minucie, a czekanie dokładało tę minutę do
    # każdego PR-a; przy czerwonym lincie e2e idą na darmo, ale nic nie kosztują.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # W PR #721 wszystkie 636 testów odłamka przeszły w 29,5 min, lecz limit 30 min
    # anulował job przy zakończeniu po doliczeniu instalacji. Zapas obejmuje także
    # przygotowanie i zamknięcie joba; limity pojedynczych testów pozostają bez zmian.
    timeout-minutes: 35
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Skonfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Zainstaluj zależności
        run: npm ci
      # E2E-ODŁAMKI: pliki dzielone po zmierzonym czasie (tests/fixtures/czasy-e2e.json), a nie
      # po liczbie testów jak `--shard` — ten dawał trzeciemu odłamkowi koniec alfabetu i cały
      # projekt mobilny. Każdy runner liczy ten sam deterministyczny podział i bierze swoją
      # część; skrypt sam sprawdza, że Playwright z tą listą widzi dokładnie te pliki.
      - name: Wybierz pliki odłamka
        run: node tests/scripts/odlamki-e2e.mjs --odlamek=${{ matrix.shard }}/3 --zapisz="$RUNNER_TEMP/odlamek-e2e.txt"
      - name: Zainstaluj Chromium
        run: |
          # HTTP Azure potrafi wyczerpać limit joba podczas pobierania pakietów.
          # https://github.com/actions/runner-images/issues/14594
          # Użyj istniejących oficjalnych fallbacków HTTPS tylko w znanej konfiguracji.
          apt_mirror_list=/etc/apt/apt-mirrors.txt
          if [ -f "$apt_mirror_list" ] &&
             grep -Eq '^https://archive\.ubuntu\.com/ubuntu/([[:space:]]|$)' "$apt_mirror_list" &&
             grep -Eq '^https://security\.ubuntu\.com/ubuntu/([[:space:]]|$)' "$apt_mirror_list"; then
            sudo sed -i -E '\@^http://azure\.archive\.ubuntu\.com/ubuntu/([[:space:]]|$)@d' "$apt_mirror_list"
          fi
          npx playwright install --with-deps chromium
      - name: Uruchom testy Playwright
        run: npm run test:e2e -- --test-list="$RUNNER_TEMP/odlamek-e2e.txt"
      - name: Zachowaj raport po niepowodzeniu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  browser-summary:
    # Jeden status do reguł gałęzi: zielony tylko, gdy wszystkie odłamki są zielone.
    # Na push odłamki są pomijane, więc i ten job jest pomijany (a nie czerwony).
    name: Testy przeglądarkowe i PWA
    runs-on: ubuntu-latest
    needs: browser
    if: always() && github.event_name != 'push'
    steps:
      - name: Sprawdź wyniki odłamków
        run: |
          echo "Wynik odłamków: ${{ needs.browser.result }}"
          test "${{ needs.browser.result }}" = "success"
