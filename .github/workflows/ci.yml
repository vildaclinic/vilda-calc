name: Kontrola jakości

on:
  push:
    branches: [audyt, agent/nowa-strona-glowna]
  pull_request:
    branches: [audyt, agent/nowa-strona-glowna]
  workflow_dispatch:
    inputs:
      baza_pr:
        description: 'Gałąź docelowa PR-a (dla końcowego PR-a nowego interfejsu wybierz audyt)'
        type: choice
        options:
          - audyt
          - agent/nowa-strona-glowna
        default: audyt

permissions:
  contents: read

concurrency:
  group: vilda-calc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint, składnia i testy jednostkowe
    runs-on: ubuntu-latest
    # Pełne npm test obejmuje ponad 900 plików unit. W PR #963 limit 15 min
    # dwukrotnie przerwał aktywny przebieg bez zgłoszonych błędów testów.
    timeout-minutes: 20
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          # PR: commit scalenia z rodzicami, HEAD^1 to dokładna gałąź docelowa PR-a.
          # workflow_dispatch poza audyt: pełna historia, z wybraną bazą z origin/.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/audyt' && '0' || '2' }}
      - name: Pobierz przypięty historyczny klient do testu zgodności planów
        run: |
          git cat-file -e 'b461364002cbd3f652728b7db38dce0f1f0d9264^{commit}' || git fetch --no-tags --depth=1 origin b461364002cbd3f652728b7db38dce0f1f0d9264
          git cat-file -e 'ae903d3e0ab2f0a1c1972b877a9862436b1e2603^{commit}' || git fetch --no-tags --depth=1 origin ae903d3e0ab2f0a1c1972b877a9862436b1e2603
      - name: Skonfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Zainstaluj zależności
        run: npm ci
      - name: Uruchom kontrole bez przeglądarki
        run: npm test
      # P-WERSJE-CI: dwa wątki mogą scalić ten sam SW_VERSION bez konfliktu (#591, #594, #595).
      # HEAD^1 jest dokładną bazą PR-a: audyt albo gałęzią integracyjną nowego interfejsu.
      # „Wygląd” przekazuje tę samą bazę po wypchnięciu wzorców przez bota. Ręczny przebieg
      # poza audyt też kontroluje wersje; nie zwalniamy gałęzi integracyjnej, bo może być
      # głową końcowego PR-a do audyt. Na push krok pomijamy jak dotąd.
      - name: Sprawdź wersje względem gałęzi docelowej
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/audyt')
        env:
          BAZA: ${{ github.event_name == 'pull_request' && 'HEAD^1' || format('origin/{0}', inputs.baza_pr || 'audyt') }}
        run: |
          case "$BAZA" in
            'HEAD^1'|'origin/audyt'|'origin/agent/nowa-strona-glowna') ;;
            *) echo '::error title=Nieobsługiwana baza::Dozwolona jest tylko dokładna baza PR-a lub jedna z dwóch gałęzi docelowych.'; exit 2 ;;
          esac
          # Wybranie własnej gałęzi jako bazy dałoby pozornie zielony wynik bez porównania.
          if [ "$BAZA" = "origin/${GITHUB_REF_NAME:-}" ]; then
            echo '::error title=Baza jest gałęzią badaną::Dla końcowego PR-a gałęzi integracyjnej wybierz audyt.'
            exit 2
          fi
          kod=0
          wynik=$(node tests/scripts/podbij-wersje.mjs --sprawdz --bez-sieci --baza="$BAZA" 2>&1) || kod=$?
          printf '%s\n' "$wynik"
          # Linie „BŁĄD:” (np. usunięty historyczny wpis precache) skrypt odmawia naprawić sam.
          printf '%s\n' "$wynik" | grep '^BŁĄD: ' | while IFS= read -r linia; do
            linia=${linia#BŁĄD: }
            echo "::error title=Błąd wersji do ręcznej poprawki::${linia//%/%25}"
          done || true
          # „Do decyzji” (np. zmieniona treść pliku z nieliczbowym ?v=) nie zmienia kodu, ale ma być widoczne
          # w podsumowaniu PR-a, nie tylko w logu zielonego joba. Piny w testach pomijamy — to lista do przejrzenia.
          printf '%s\n' "$wynik" | grep '^Do decyzji: ' | grep -v '^Do decyzji: pin wersji w teście' | while IFS= read -r linia; do
            linia=${linia#Do decyzji: }
            echo "::warning title=Wersje — do decyzji::${linia//%/%25}"
          done || true
          if [ "$kod" = 1 ]; then
            echo "::error title=Wersje niespójne z bazą::Na gałęzi PR-a pobierz i scal aktualną gałąź docelową, następnie uruchom npm run podbij-wersje -- --baza=origin/GAŁĄŹ_DOCELOWA oraz npm test, commit i push. Dla audyt zostaje domyślna baza. Linie „BŁĄD:” popraw najpierw ręcznie. Procedura: docs/GITHUB_WORKFLOW.md."
          elif [ "$kod" != 0 ]; then
            echo "::error title=Nie policzono wersji::podbij-wersje zakończył się kodem $kod — przyczyna w logu wyżej."
          fi
          exit "$kod"

  browser:
    # Nazwa jest widoczna dla właściciela jako odłamek, a wymagany status w regułach gałęzi
    # to job „Testy przeglądarkowe i PWA" niżej, który zbiera wyniki wszystkich odłamków.
    name: E2E odłamek ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    # Po „Squash and merge" e2e nie idą drugi raz. Reguła gałęzi „Require branches to be
    # up to date before merging" gwarantuje, że drzewo po squashu jest tym samym drzewem,
    # które przeszło testy na PR-ze — drugi, 15-minutowy przebieg niczego nie dokładał.
    # Lint i testy jednostkowe (job wyżej) na push zostają: kosztują minutę i dają gałęzi
    # własną historię zielone/czerwone. Pełny zestaw na audyt: ręcznie (workflow_dispatch).
    if: github.event_name != 'push'
    # Osiem runnerów naraz, każdy z czterema workerami — dla repozytorium publicznego minuty
    # Actions nic nie kosztują, a zestaw dzieli się plikami między maszyny. Nie czeka na
    # job jednostkowy: ten i tak kończy się po minucie, a czekanie dokładało tę minutę do
    # każdego PR-a; przy czerwonym lincie e2e idą na darmo, ale nic nie kosztują.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # W PR #793 limit 40 min przerwał aktywny przebieg przy 699/722 uruchomionych
    # testach bez zgłoszonych błędów; pozostałe odłamki potrzebowały ok. 39 min.
    # W PR #802 limit 45 min przerwał odłamek 2/3 przy 753/769 testach,
    # nadal regularnie wykonywanych, bez błędów asercji przed anulowaniem.
    # W PR #823 limit 50 min przerwał odłamek 3/3 przy 807/810 testach
    # z ciągłym postępem i bez błędu asercji; pozostałe trwały 43,2 i 47,4 min.
    # W PR #826 limit 50 min przerwał odłamek 1/3 przy 901/915 testach.
    # W PR #841 limit 60 min przerwał odłamek 1/3 przy liczniku 759/888 uruchomionych testów,
    # z ciągłym postępem i bez błędu asercji. Zestaw 2670 testów dzielimy na
    # cztery części; nie zwiększamy limitu joba ani limitów pojedynczych testów.
    # PR #847: pełne 2728 przypadków zajęło 41,4–43,3 min samych testów na czterech
    # równomiernie obciążonych runnerach. Osiem części zwiększa równoległość między
    # maszynami; na każdym runnerze nadal cztery workery, a wewnątrz plików ta sama
    # kolejność i izolacja.
    # Budżet obejmuje instalację Chromium, testy i raport. Limity pojedynczych
    # testów, liczba workerów i wymagane asercje pozostają bez zmian.
    timeout-minutes: 60
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          # Sodium PWA tests install an actual archived previous application.
          fetch-depth: 0
      - name: Skonfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Zainstaluj zależności
        run: npm ci
      # E2E-ODŁAMKI: pliki dzielone po zmierzonym czasie (tests/fixtures/czasy-e2e.json), a nie
      # po liczbie testów jak `--shard` — ten dawał trzeciemu odłamkowi koniec alfabetu i cały
      # projekt mobilny. Każdy runner liczy ten sam deterministyczny podział i bierze swoją
      # część; skrypt sam sprawdza, że Playwright z tą listą widzi dokładnie te pliki.
      - name: Wybierz pliki odłamka
        run: node tests/scripts/odlamki-e2e.mjs --odlamek=${{ matrix.shard }}/8 --zapisz="$RUNNER_TEMP/odlamek-e2e.txt"
      - name: Zainstaluj Chromium
        run: |
          # HTTP Azure potrafi wyczerpać limit joba podczas pobierania pakietów.
          # https://github.com/actions/runner-images/issues/14594
          # Użyj istniejących oficjalnych fallbacków HTTPS tylko w znanej konfiguracji.
          apt_mirror_list=/etc/apt/apt-mirrors.txt
          if [ -f "$apt_mirror_list" ] &&
             grep -Eq '^https://archive\.ubuntu\.com/ubuntu/([[:space:]]|$)' "$apt_mirror_list" &&
             grep -Eq '^https://security\.ubuntu\.com/ubuntu/([[:space:]]|$)' "$apt_mirror_list"; then
            sudo sed -i -E '\@^http://azure\.archive\.ubuntu\.com/ubuntu/([[:space:]]|$)@d' "$apt_mirror_list"
          fi
          npx playwright install --with-deps chromium
      - name: Uruchom testy Playwright
        run: npm run test:e2e -- --test-list="$RUNNER_TEMP/odlamek-e2e.txt"
      - name: Zachowaj raport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  lab_chart_webkit:
    name: Geometria wykresów — Safari/WebKit
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    # Includes seven additional real-vault advanced-growth scenarios. Keep all
    # chart, M1, mobile, puberty and perinatal cases and their per-case budgets.
    timeout-minutes: 20
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Skonfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Zainstaluj zależności
        run: npm ci
      - name: Zainstaluj WebKit
        run: |
          apt_mirror_list=/etc/apt/apt-mirrors.txt
          if [ -f "$apt_mirror_list" ] &&
             grep -Eq '^https://archive\.ubuntu\.com/ubuntu/([[:space:]]|$)' "$apt_mirror_list" &&
             grep -Eq '^https://security\.ubuntu\.com/ubuntu/([[:space:]]|$)' "$apt_mirror_list"; then
            sudo sed -i -E '\@^http://azure\.archive\.ubuntu\.com/ubuntu/([[:space:]]|$)@d' "$apt_mirror_list"
          fi
          npx playwright install --with-deps webkit
      - name: Sprawdź narysowane punkty i otwieranie zapisów
        run: npm run test:e2e -- --config playwright.lab-chart-webkit.config.mjs
      - name: Zachowaj raport geometrii
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-lab-chart-webkit
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  browser-summary:
    # Jeden status do reguł gałęzi: zielony tylko, gdy wszystkie odłamki są zielone.
    # Na push odłamki są pomijane, więc i ten job jest pomijany (a nie czerwony).
    name: Testy przeglądarkowe i PWA
    runs-on: ubuntu-latest
    needs: [browser, lab_chart_webkit]
    if: always() && github.event_name != 'push'
    steps:
      - name: Sprawdź wyniki odłamków
        run: |
          echo "Wynik odłamków: ${{ needs.browser.result }}"
          echo "Wynik geometrii Safari/WebKit: ${{ needs.lab_chart_webkit.result }}"
          test "${{ needs.browser.result }}" = "success"
          test "${{ needs.lab_chart_webkit.result }}" = "success"
