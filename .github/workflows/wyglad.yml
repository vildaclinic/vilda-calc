name: Wygląd

# P-STYLE rata 1 (decyzja właściciela 2026-09-28): siatka zrzutów stron w czterech trybach wyglądu
# (tests/visual) i kontrola dryfu stylów względem design systemu (design-system --strict).
# Idzie tylko dla zmian, które mogą zmienić wygląd (filtr ścieżek niżej), żeby nie hałasować
# przy zmianach klinicznych. Skutek uboczny: zmiana renderowania z pliku spoza filtra wyjdzie
# dopiero przy najbliższym PR-ze ze stylami — wtedy odświeża się wzorce jak niżej.
#
# Wzorce zrzutów (tests/visual/wzorce) powstają WYŁĄCZNIE tu, na ubuntu-latest: czcionki
# i wygładzanie różnią się między systemami, więc wzorzec z Maca nie zgodzi się z Linuksem.
# Dwie drogi odświeżenia po ZAMIERZONEJ zmianie wyglądu:
#   1. Actions → „Wygląd" → „Run workflow" na gałęzi PR-a z zaznaczonym „aktualizuj_wzorce"
#      (przycisk jest dostępny, gdy ten plik jest już na gałęzi domyślnej);
#   2. usunięcie katalogu tests/visual/wzorce w PR-ze — job widzi brak wzorców i tworzy je od nowa.
# W obu wypadkach job wypycha wzorce na gałąź jednym commitem (i zachowuje jako artefakt), a że
# commit z GITHUB_TOKEN sam nie uruchamia workflow'ów, dodatkowo uruchamia „Kontrola jakości"
# i „Wygląd" dla nowego commita przez workflow_dispatch (jedyny wyjątek od tej reguły GitHuba).
# Różnice obrazów ogląda się potem w PR-ze.

on:
  pull_request:
    branches: [audyt]
    paths:
      - '*.css'
      - '*.html'
      - 'ios26-ui.js'
      - 'custom-fixes.js'
      - 'vilda_shell.js'
      - 'vilda_chrome.js'
      - 'vilda_auth_ui.js'
      - 'design-system/**'
      - 'tests/visual/**'
      - 'tests/support/**'
      - 'playwright.config.mjs'
      - 'playwright.visual.config.mjs'
      - '.github/workflows/wyglad.yml'
  workflow_dispatch:
    inputs:
      aktualizuj_wzorce:
        description: 'Odśwież wzorce zrzutów w CI i wypchnij je na tę gałąź'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vilda-calc-wyglad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-system:
    name: Dryf stylów względem design systemu
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Skonfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Zainstaluj zależności
        run: npm ci
      - name: Odbuduj design system i sprawdź dryf
        run: npm run design-system -- --strict

  zrzuty:
    name: Zrzuty wyglądu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # zapis do gałęzi i uruchomienie kontroli tylko przy odświeżaniu wzorców; przy PR-ze z forka
    # token i tak jest tylko do odczytu
    permissions:
      contents: write
      actions: write
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          # czubek gałęzi (nie commit scalenia z bazą): tylko na niego da się wypchnąć wzorce
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Skonfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Zainstaluj zależności
        run: npm ci
      - name: Zainstaluj Chromium
        run: npx playwright install --with-deps chromium
      - name: Ustal tryb (porównanie albo odświeżenie wzorców)
        id: tryb
        env:
          Z_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.aktualizuj_wzorce == true }}
        run: |
          if [ "$Z_DISPATCH" = "true" ]; then
            echo "aktualizuj=true" >> "$GITHUB_OUTPUT"; echo "powod=Run workflow z opcją aktualizuj_wzorce"
          elif [ ! -d tests/visual/wzorce ]; then
            echo "aktualizuj=true" >> "$GITHUB_OUTPUT"; echo "powod=brak katalogu tests/visual/wzorce"
          else
            echo "aktualizuj=false" >> "$GITHUB_OUTPUT"; echo "powod=porównanie z wzorcami"
          fi
      - name: Porównaj strony z wzorcami
        if: steps.tryb.outputs.aktualizuj != 'true'
        run: npm run test:visual
      - name: Utwórz wzorce od nowa
        if: steps.tryb.outputs.aktualizuj == 'true'
        run: npm run test:visual -- --update-snapshots
      - name: Zachowaj wzorce jako artefakt
        if: steps.tryb.outputs.aktualizuj == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wzorce-zrzutow-wygladu
          path: tests/visual/wzorce/
          retention-days: 14
      - name: Wypchnij wzorce na gałąź i uruchom kontrole dla nowego commita
        if: steps.tryb.outputs.aktualizuj == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          GALAZ: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tests/visual/wzorce
          if git diff --cached --quiet; then
            echo "wzorce bez zmian"
            exit 0
          fi
          git commit -m "Wzorce zrzutów wyglądu odświeżone w CI (ubuntu-latest, Chromium Playwrighta)"
          git push origin "HEAD:${GALAZ}"
          # commit z GITHUB_TOKEN nie uruchamia workflow'ów; workflow_dispatch jest wyjątkiem
          gh workflow run ci.yml --ref "$GALAZ"
          gh workflow run codeql.yml --ref "$GALAZ"
          gh workflow run wyglad.yml --ref "$GALAZ" || echo 'Wygląd nie jest jeszcze na gałęzi domyślnej: porównanie pójdzie przy następnym pushu'
      - name: Zachowaj różnice po niepowodzeniu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zrzuty-wygladu-roznice
          path: test-results-wyglad/
          retention-days: 14
