name: Diagnostyka GH — 10 powtórzeń WebKit, wyłącznie fikcyjne dane

on:
  push:
    branches: [agent/diagnostyka-gh-sesja]

permissions:
  contents: read

concurrency:
  group: gh-session-diagnostic-${{ github.ref }}
  cancel-in-progress: false

# Diagnostic branch only. Never merge, publish or treat this as a release gate.
# Full native WebKit88 with a32 failure-only capture runs separately in normal CI.
jobs:
  refusal-stress:
    if: github.repository == 'vildaclinic/vilda-calc' && github.ref == 'refs/heads/agent/diagnostyka-gh-sesja'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Pobierz wyłącznie gałąź diagnostyczną
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Skonfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Zainstaluj niezmienione zależności
        run: npm ci
      - name: Zainstaluj WebKit jak w oryginalnym CI
        run: |
          apt_mirror_list=/etc/apt/apt-mirrors.txt
          if [ -f "$apt_mirror_list" ] &&
             grep -Eq '^https://archive\.ubuntu\.com/ubuntu/([[:space:]]|$)' "$apt_mirror_list" &&
             grep -Eq '^https://security\.ubuntu\.com/ubuntu/([[:space:]]|$)' "$apt_mirror_list"; then
            sudo sed -i -E '\@^http://azure\.archive\.ubuntu\.com/ubuntu/([[:space:]]|$)@d' "$apt_mirror_list"
          fi
          npx playwright install --with-deps webkit
      - name: Zweryfikuj niezmienione źródło, odkryj testy i przygotuj obserwator samych odmów
        run: node tests/diagnostics/gh-session/prepare.mjs prepare refusal
      - name: Uruchom dokładnie 10 powtórzeń oryginalnego przypadku GH 390, bez retry
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e -- --config playwright.lab-chart-webkit.config.mjs --project home-workspace-webkit --grep 'home A2: native GH portal cancels purely and saves/imports the original therapy point · 390' --repeat-each 10 --retries 0 2>&1 | tee "$RUNNER_TEMP/gh-session-diagnostic-refusal/runtime.log"
      - name: Przywróć oryginalny test i sprawdź wszystkie pliki aplikacji
        if: always()
        run: node tests/diagnostics/gh-session/prepare.mjs restore refusal
      - name: Zachowaj dowody diagnostyczne i oryginalne ślady
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gh-session-refusal-stress10-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gh-session-diagnostic-refusal/
            playwright-report/
            test-results/
          retention-days: 14
