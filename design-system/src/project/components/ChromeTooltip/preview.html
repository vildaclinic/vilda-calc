<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>ChromeTooltip</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>/* tylko układ podglądu */
body{margin:0;padding:16px 16px 16px 24px;background:var(--bg)}
.ds-row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:28px}
.ds-col{display:flex;flex-direction:column;gap:14px}
/* dymek jest w aplikacji position:fixed obok kotwicy — w podglądzie tylko przepływ dokumentu */
body .vilda-tip{position:relative!important}
body .has-vilda-chrome .menu-tooltip{position:relative!important}
</style></head><body class="liquid-ios26">
<div class="ds-row">
  <div class="ds-col">
    <div class="vilda-tip vilda-tip--in" role="tooltip">Aby zapisać dane, wprowadź imię, wiek, wzrost i wagę.</div>
    <div class="vilda-tip vilda-tip--in" role="tooltip">Zaloguj się, aby przeglądać bazę pacjentów.</div>
  </div>
  <div class="ds-col has-vilda-chrome">
    <div class="menu-tooltip" style="opacity:1" role="tooltip">Strona główna</div>
    <div class="menu-tooltip copy-tooltip" style="opacity:1" role="status" aria-live="polite">Skopiowano zalecenia do schowka.</div>
  </div>
</div>
</body></html>
