<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>Banner</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>/* tylko układ podglądu */
body{margin:0;padding:16px;background:var(--bg)}
.stack{display:flex;flex-direction:column;gap:14px;max-width:720px}
/* elementy fixed pokazane w przepływie — nadpisanie wyłącznie pozycji */
body #sw-update-banner{position:static!important;transform:none!important}
body #updateBanner{position:static!important}
</style></head><body class="liquid-ios26">
<div class="stack">
  <div id="sw-update-banner" role="alert" aria-live="polite" aria-atomic="true">
      <span class="ww-sw-update-banner__ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></svg></span>
      <span class="ww-sw-update-banner__message">
        <span class="ww-sw-update-banner__title"><strong>Dostępna nowa wersja aplikacji</strong></span>
        <span class="ww-sw-update-banner__sub">Aplikacja działa najlepiej i najbezpieczniej w najnowszej wersji.</span>
      </span>
      <div class="ww-sw-update-banner__actions">
        <button id="sw-refresh" type="button" class="btn ww-sw-refresh--pulse" data-vilda-sw-update-action="refresh" aria-label="Zaktualizuj aplikację do najnowszej wersji">Aktualizuj</button>
        <button id="sw-dismiss" type="button" class="btn" style="opacity:.8" data-vilda-sw-update-action="dismiss" aria-label="Odłóż aktualizację aplikacji na później">Później</button>
      </div>
  </div>
  <div id="updateBanner" role="status" style="display:block">Dostępna nowa wersja aplikacji.
    <button type="button">Odśwież</button>
    <button type="button" class="dismiss">Później</button>
  </div>
  <div class="vilda-pro-gate-banner vilda-pro-gate-banner--upgrade" style="display:flex">
    <span class="vilda-pro-gate-banner__text">⚡ Odblokuj wyniki profesjonalne</span>
    <a href="subskrypcja.html" class="vilda-pro-gate-banner__btn">Sprawdź PRO</a>
  </div>
  <div class="vilda-pro-gate-banner vilda-pro-gate-banner--login" style="display:flex">
    <span class="vilda-pro-gate-banner__text">🔐 Zaloguj się, aby odblokować tryb profesjonalny</span>
    <button class="vilda-pro-gate-banner__btn">Zaloguj się</button>
  </div>
</div>
</body></html>
