<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>SettingItem</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>/* tylko układ podglądu */body{margin:0;padding:16px;background:var(--bg)}.wrap{max-width:900px}</style></head><body class="liquid-ios26 page-settings">
<div class="wrap">
<div id="settingsGrid" class="settings-grid">
  <div class="setting-item">
    <span>Pokaż dock</span>
    <label class="switch">
      <input type="checkbox" id="showMobileDockSetting" checked>
      <span class="slider"></span>
    </label>
  </div>
  <div class="setting-item">
    <span>Pokaż strzałkę nawigacyjną</span>
    <label class="switch">
      <input type="checkbox" id="showNavigationArrowSetting">
      <span class="slider"></span>
    </label>
  </div>
  <div class="setting-item">
    <span>Szybki dock (wersja testowa)</span>
    <label class="switch">
      <input type="checkbox" id="fastDockShellSetting" disabled>
      <span class="slider"></span>
    </label>
  </div>
</div>
</div>
</body></html>
