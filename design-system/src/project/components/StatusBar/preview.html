<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>StatusBar</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>/* tylko układ podglądu */
body{margin:0;padding:16px;background:var(--bg)}
.col{display:flex;flex-direction:column;gap:12px;max-width:560px}
</style></head><body class="liquid-ios26">
<div class="col">
  <div id="vildaStatusSide" data-vilda-status role="status" aria-live="polite" data-ton="ok"><span class="vilda-status-znak" aria-hidden="true">✓</span><span class="vilda-status-tresc"><span class="vilda-status-tekst">Zapisano (snapshot 3) dla Jan Testowy.</span><span class="vilda-status-meta">14:32</span></span></div>
  <div data-vilda-status role="status" aria-live="polite" data-ton="nowy"><span class="vilda-status-znak" aria-hidden="true">＋</span><span class="vilda-status-tresc"><span class="vilda-status-tekst">Zapisano nowego pacjenta: Jan Testowy.</span><span class="vilda-status-meta">14:35</span></span></div>
  <div data-vilda-status role="status" aria-live="polite" data-ton="uwaga"><span class="vilda-status-znak" aria-hidden="true">●</span><span class="vilda-status-tresc"><span class="vilda-status-tekst">Zaloguj się, aby zapisać dane pacjentów.</span><span class="vilda-status-meta">14:36</span></span></div>
  <div data-vilda-status role="status" aria-live="polite" data-ton="blad"><span class="vilda-status-znak" aria-hidden="true">✕</span><span class="vilda-status-tresc"><span class="vilda-status-tekst">Nie zapisano — uzupełnij: <button type="button" class="vilda-status-link">wiek</button>, <button type="button" class="vilda-status-link">masę ciała</button> i <button type="button" class="vilda-status-link">wzrost</button>.</span><span class="vilda-status-meta">14:38</span></span></div>
  <div data-vilda-status role="status" aria-live="polite" data-ton="info"><span class="vilda-status-znak" aria-hidden="true">ℹ</span><span class="vilda-status-tresc"><span class="vilda-status-tekst">Zapis anulowany — nic nie zmieniono.</span><span class="vilda-status-meta">14:40</span></span></div>
</div>
</body></html>
